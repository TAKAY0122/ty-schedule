name = "ty-schedule"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "schedule-db"
database_id = "2806d7f0-3096-4e9a-a2cc-f45f7a1cc6f7"

[[r2_buckets]]
binding = "DAICHO"
bucket_name = "ty-daicho"

[triggers]
# 4つのcron処理(台帳再取込・予定表ソース取込・ランク昇格適用・新人報告リマインド)は、
# 以前は1本のcron("0 * * * *")の中でscheduled()が順番に全部実行する設計だった。
# 台帳・予定表の取込(特に予定表ソースの中でも大きいシートを持つもの)が重くなった際、
# 1回の起動に処理が集中してWorkerの実行が中断され、Cloudflare側の自動リトライで
# 数十分後にようやく完了する、という遅延が本番で実際に発生した(2026年8月)。
# 各処理に専用のcronスケジュール(実行時刻を5分ずつずらしただけの毎時実行)を割り当て、
# 起動(=CPU時間・実行時間の予算)を分離することで、1つの処理が重くても他の処理を
# 巻き込まないようにしている。scheduled()側はevent.cronの値で分岐する。
crons = ["0 * * * *", "5 * * * *", "10 * * * *", "15 * * * *"]