# design-tokens.yaml
# RB事業2課 スケジュール管理システム — デザイントークン定義
#
# 目的: 色・フォント・余白・角丸・影・モーションのルールを1箇所に集約し、
#   public/style.css / public/app.js を実装するときは必ずこのファイルの値を参照する。
#   新しい色・サイズが必要になった場合は、まずここに追記してから実装に反映する
#   (CSSに直接その場しのぎの値を書き足さない)。
#
# 方針: 既存の「濃紺×金(シック)」というブランドトーンは維持する。
#   紫グラデーション・絵文字アイコンは使わない(既存コードにも実質無い状態を維持する)。
#   参照するデザインシステム: IBM Carbon Design System
#   (理由はこのファイルの末尾 `reference_design_system` を参照)

meta:
  name: "RB事業2課 スケジュール管理システム"
  tone: "シック(濃紺×金)。業務システムとしての信頼感・情報の見やすさを最優先。装飾は最小限。"
  reference_design_system: "IBM Carbon Design System"

# ==========================================================================
# 色
# ==========================================================================
colors:
  # --- ブランド / ベース ---
  brand:
    ink: "#1B2333"        # 濃紺(プライマリ。ヘッダー・見出し罫・主要ボタン)
    ink_2: "#2A3550"       # 濃紺(ホバー時など、inkより一段明るい)
    gold: "#C9A227"        # 金(アクセント。強調・選択状態・ブランドの象徴色)
    gold_light: "#E0BC4C"  # 金(明るい方。使用箇所を絞る=グラデーションでの多用はしない)
    gold_dark: "#B8901F"   # 金(暗い方。同上)

  # --- 背景 / 面 ---
  surface:
    page_bg: "#F5F4F0"     # ページ背景(紙のような温かみのあるオフホワイト)
    card_bg: "#FFFFFF"     # カード・モーダル等の面
    subtle_bg: "#F7F5EF"   # カード内の一段沈んだ面(情報ボックス・行の区切り等)
    inverse_bg: "#1B2333"  # 濃紺地に白文字を乗せる面(ヘッダー・合計行・サマリー等)

  # --- 罫線 ---
  border:
    default: "#C9C9C4"
    subtle: "#F0EEE7"      # ごく薄い区切り線(リスト項目間など)

  # --- テキスト ---
  text:
    primary: "#1B2333"     # 本文の強調・見出し(=inkと共通)
    body: "#222222"        # 通常本文
    secondary: "#6B6B7B"   # 補足・キャプション
    muted: "#888888"       # さらに弱い補足(タイムスタンプ等)
    on_inverse: "#F3F1EA"  # 濃紺地の上の文字
    link: "#1A4FB0"

  # --- 状態色(意味を持つ色。ここに無い色を新たに増やさない) ---
  status:
    success:
      text: "#1F7A3D"
      bg: "#E7F6EC"
      border: "#8FC9A0"
    warning:
      text: "#8A6300"
      bg: "#FFF3D6"
      border: "#F0DCA8"
    danger:
      text: "#C0392B"
      bg: "#FDECEA"
      border: "#F3C6C6"
    info:                  # 「土曜」「件数少なめ」等、注意喚起ではない中立の強調
      text: "#1F5FD6"
      bg: "#EAF2FB"
      border: "#CDD6EE"
    # 「同一会場の繰り返し」など、上記4色では表現しきれない5個目の状態のみ使用可。
    # 装飾目的のグラデーションには使わないこと。
    special:
      text: "#8E5FC7"
      bg: "#F3EDF9"
      border: "#D9C7EC"

  # --- 課(1課/2課)の視覚区別。既存のka1/ka2を踏襲 ---
  department:
    ka1:
      text: "#1F5391"
      bg: "#EAF2FB"
      accent: "#2E6FB7"
    ka2:
      text: "#8A6D12"
      bg: "#FBF6E7"
      accent: "#C9A227"    # goldと共通

  # --- 曜日 ---
  calendar:
    saturday: "#1F5FD6"
    sunday: "#D93636"

# ==========================================================================
# タイポグラフィ
# ==========================================================================
typography:
  font_family: '"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif'
  font_family_mono: "ui-monospace,Consolas,monospace"

  # 既存は22/17/15.5/15/14.5/14/13.5/13/12.5/12/11.5/11/10.5pxと粒度が細かすぎたため、
  # 8段階のスケールに整理する。新しい文字サイズが要る場合はこの中から選ぶ。
  scale:
    display: { size: "22px", weight: 800, line_height: 1.2 }   # KPI等の大数値
    h1:      { size: "19px", weight: 700, line_height: 1.3 }   # ページ最上位見出し(現状のh2用途)
    h2:      { size: "16px", weight: 700, line_height: 1.35 }  # カード見出し・モーダルタイトル
    h3:      { size: "14px", weight: 700, line_height: 1.4 }   # 小見出し・強調ラベル
    body:     { size: "14px", weight: 400, line_height: 1.55 } # 通常本文(基準サイズ)
    body_sm: { size: "13px", weight: 400, line_height: 1.5 }   # 表内・補助的な本文
    caption: { size: "12px", weight: 400, line_height: 1.4 }   # 補足・タイムスタンプ
    micro:   { size: "11px", weight: 600, line_height: 1.3 }   # バッジ・タグ・ラベル

# ==========================================================================
# 余白(スペーシング)
# ==========================================================================
spacing:
  base_unit: "4px"
  # 4pxの倍数のみを使う。中途半端な値(7px,9px,11px等)は新規に増やさない。
  scale:
    xxs: "4px"
    xs:  "8px"
    sm:  "12px"
    md:  "16px"
    lg:  "20px"
    xl:  "24px"
    xxl: "32px"
    xxxl: "40px"

# ==========================================================================
# 角丸(半径)
# ==========================================================================
radius:
  # コンポーネントの「格」に応じて3段階+ピルのみに統一する。
  # 現状は10/8/14/12/6pxなどが根拠なく混在しているため、以下に統合する。
  sm: "6px"    # 入力欄・小さいボタン・チップ
  md: "8px"    # カード・リスト項目・モーダル・一般的なコンテナ
  lg: "12px"   # ダッシュボードカード・ホームメニューボタン等、より目立たせたい面
  pill: "999px" # バッジ・タグ・トグルスイッチ

# ==========================================================================
# 影(elevation)— 既存の3段階スケールをそのまま踏襲(すでに妥当なため変更しない)
# ==========================================================================
elevation:
  sm: "0 1px 2px rgba(20,20,30,.04), 0 1px 3px rgba(20,20,30,.06)"   # カードの基本状態
  md: "0 2px 6px rgba(20,20,30,.06), 0 8px 20px rgba(20,20,30,.08)"  # ホバー・ドロップダウン
  lg: "0 8px 24px rgba(20,20,30,.10), 0 24px 60px rgba(20,20,30,.16)" # モーダル・ログインカード

# ==========================================================================
# モーション
# ==========================================================================
motion:
  easing:
    spring: "cubic-bezier(.34,1.56,.64,1)"   # ボタンの押下復帰など、触感のある操作
    ease_out: "cubic-bezier(.22,1,.36,1)"    # カードの浮き上がり等
  duration:
    fast: "120ms"    # ホバー・フォーカス
    base: "200ms"    # 通常のトランジション
    slow: "300ms"    # モーダル・ドロワーの開閉
  reduced_motion: "既存どおり prefers-reduced-motion: reduce を尊重し、全アニメーションを実質無効化する"

# ==========================================================================
# アイコン
# ==========================================================================
icons:
  style: "線画SVG(既存の icon() 関数 / ICONS 定数を継続使用)"
  forbidden: "絵文字をUIパーツ・アイコンとして使用しない(本文中の注意書きの記号も含め、絵文字は使わない)"
  stroke_width: "既存のICONS定義に準拠"
  color: "currentColor(周囲のテキスト色を継承)"

# ==========================================================================
# 明示的な禁止事項(このプロジェクト全体に適用)
# ==========================================================================
forbidden:
  - "紫〜青のグラデーション背景(装飾目的のもの)"
  - "絵文字をUIパーツ・アイコンとして使うこと"
  - "根拠のない角丸・シャドウの値を新たに増やすこと(このファイルの radius / elevation 以外の値を使わない)"
  - "status色以外の目的でstatus.specialの紫を使うこと(グラデーション化も含む)"
